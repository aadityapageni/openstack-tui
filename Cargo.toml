[package]
name = "openstack-tui"
version = "0.1.0"
edition = "2021"
description = "k9s-inspired terminal UI for kolla-ansible provisioned OpenStack"
authors = []
license = "MIT"
repository = "https://github.com/aadityapageni/openstack-tui"
keywords = ["openstack", "tui", "ratatui", "kolla", "devops"]
categories = ["command-line-utilities"]

[[bin]]
name = "os9s"
path = "src/main.rs"

[dependencies]
# ── TUI ──────────────────────────────────────────────────────────────
ratatui       = "0.28"
crossterm     = { version = "0.28", features = ["event-stream"] }

# ── Async runtime ─────────────────────────────────────────────────────
tokio         = { version = "1", features = ["full"] }
tokio-util    = "0.7"

# ── HTTP client ───────────────────────────────────────────────────────
reqwest       = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Serialization ─────────────────────────────────────────────────────
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_yaml    = "0.9"

# ── CLI ───────────────────────────────────────────────────────────────
clap          = { version = "4", features = ["derive", "env"] }

# ── Error handling ────────────────────────────────────────────────────
anyhow        = "1"
thiserror     = "2"

# ── Logging ───────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"

# ── Utilities ────────────────────────────────────────────────────────
dirs           = "5"            # XDG config path resolution
chrono         = { version = "0.4", features = ["serde"] }
humansize      = "2"            # "1.2 GiB" formatting
arboard        = "3"            # clipboard copy (xclip / wl-clipboard)
fuzzy-matcher  = "0.3"          # inline search filtering
once_cell      = "1"            # lazy static globals

[dev-dependencies]
tokio-test  = "0.4"
mockito     = "1"               # HTTP mock server for API tests

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true            # strip debug symbols → smaller binary

[profile.dev]
opt-level     = 0
debug         = true
